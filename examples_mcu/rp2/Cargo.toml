[package]
name = "rp2"
edition = "2024"
version = "0.1.0"

[dependencies]
#cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
#cortex-m-rt = { version = "0.7.0", features = ["paint-stack"] } paint-stack crashes with BusFault
cortex-m-rt = "0.7.0"

critical-section = "1.1"

embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-usb = { version = "0.6.0", features = ["defmt"], optional = true }
embassy-futures = { version = "0.1.2" }

cnt = "0.4"
defmt = "1.1"
rtt-target = { version = "0.6", optional = true }
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2.1"

wire_weaver_usb_embassy = { git = "https://github.com/vhrdtech/wire_weaver", optional = true }
ww_device = { git = "https://github.com/vhrdtech/wire_weaver", features = ["defmt", "embassy-time"] }
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["defmt"] }
ww_client_server = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
defmt_log_api = { path = "../../examples/defmt_log_api", optional = true }
ww_defmt_logger = { path = "../../ww_defmt_logger", features = ["rtt"], optional = true }
ww_log = { path = "../../ww_log", default-features = false, features = ["defmt"], optional = true }
ww_stream = { git = "https://github.com/vhrdtech/wire_weaver", features = ["defmt"], optional = true }
ww_firmware_info = { path = "../../ww_firmware_info", default-features = false, features = ["build-id"], optional = true }

[features]
# defmt over USB (ww_log::LogDefmt) and RTT at once, through ww_defmt_logger instead of defmt-rtt
usb_log = ["usb", "dep:rtt-target", "dep:defmt_log_api", "dep:ww_defmt_logger", "dep:ww_log", "dep:ww_stream", "dep:ww_firmware_info"]
usb = ["dep:embassy-usb", "dep:wire_weaver_usb_embassy"]

[[bin]]
name = "rp2_usb_log"
path = "src/bin/usb_log.rs"
required-features = ["usb_log"]
test = false
doctest = false
bench = false

[profile.release]
codegen-units = 1
debug = 2 # full debug info for defmt and probe-rs, doesn't end up in flash
lto = 'fat'
opt-level = "z" # 3 - speed, s - size, z - even less size
