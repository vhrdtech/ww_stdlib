[package]
name = "mcu_qemu"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.6"
panic-semihosting = { version = "0.7", features = ["exit"] }

ww_bus_slave = { path = "../../ww_bus_slave" }
ww_i2c = { path = "../../ww_i2c", default-features = false }
ww_spi = { path = "../../ww_spi", default-features = false }
ww_si = { git = "https://github.com/vhrdtech/ww_base", default-features = false, features = ["electrical", "angle", "dimensionless", "information", "counting", "time", "i32", "u32"] }

# to solve "can't find crate for test on IntelliJ"
[[bin]]
name = "qemu-bus-slave"
path = "src/bin/bus_slave.rs"
test = false
doctest = false
bench = false

# the profile of the shipped firmware (usb_stm32h725ig's release)
[profile.fw-z]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "z"

# the same at opt-level 3, to see what `z` costs in speed
[profile.fw-3]
inherits = "fw-z"
opt-level = 3
