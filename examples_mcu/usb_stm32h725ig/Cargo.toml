[package]
name = "usb_fdcan_h725ig"
version = "0.1.0"
edition = "2024"

[features]
# counted streams and credit sinks (ww_gpio's `event`, ww_uart's `rx` and `tx`): the all-gpio and uart bins
streams = [
    "ww_client_server/streams",
    "ww_stream/streams",
    "dep:all_gpio_api",
    "dep:bbqueue",
    "dep:uart_api",
    "dep:ww_gpio",
    "dep:ww_uart",
]

[dependencies]
cortex-m-rt = "0.7"
cnt = "0.4"
defmt = "1.1"
defmt-rtt = "1.3" # consider disable-blocking-mode
panic-probe = { version = "1.0", features = ["print-defmt"] }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
embassy-stm32 = { version = "0.6", features = ["defmt", "stm32h725ig", "unstable-pac", "exti", "time-driver-tim2"] }
stm32-metapac = { version = "21", features = ["stm32h725ig"] }

embassy-executor = { version = "0.10", features = [
    "nightly",
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt"
] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-futures = "0.1"
embassy-usb = { version = "0.6", features = ["defmt"] }
static_cell = "2.1"
bbqueue = { version = "0.7", optional = true }

all_gpio_api = { path = "../../examples/all_gpio_api", default-features = false, optional = true }
uart_api = { path = "../../examples/uart_api", default-features = false, optional = true }
wire_weaver_usb_embassy = { git = "https://github.com/vhrdtech/wire_weaver" }
wire_weaver = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["defmt"] }
ww_client_server = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_stream = { git = "https://github.com/vhrdtech/wire_weaver", default-features = false }
ww_gpio = { path = "../../ww_gpio", default-features = false, optional = true }
ww_uart = { path = "../../ww_uart", default-features = false, optional = true }
ww_si = { git = "https://github.com/vhrdtech/ww_base", default-features = false, features = ["electrical", "angle", "dimensionless", "time", "f32", "u32", "i32"] }

[[bin]]
name = "stm32h725ig-all-gpio"
path = "src/bin/all_gpio.rs"
test = false
doctest = false
bench = false
required-features = ["streams"]

[[bin]]
name = "stm32h725ig-uart"
path = "src/bin/uart.rs"
test = false
doctest = false
bench = false
required-features = ["streams"]

# see for more info: https://docs.rust-embedded.org/book/unsorted/speed-vs-size.html
# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2 # full debug info
debug-assertions = true
incremental = false
opt-level = 3
#opt-level = "s"
overflow-checks = true

# cargo test
[profile.test]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
#opt-level = "s"
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = "z" # 3 - speed, s - size, z - even less size
#opt-level = "s"
overflow-checks = false

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
#opt-level = "s"
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

