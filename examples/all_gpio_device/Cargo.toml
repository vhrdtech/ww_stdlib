[package]
name = "all_gpio_device"
version = "0.1.0"
description = "The GPIO expander example device: one server for the device simulated on a PC and the firmware of a board"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# build against std: owned API types, for a device simulated on a PC
std = [
    "all_gpio_api/std",
    "wire_weaver/std",
    "ww_client_server/std",
    "ww_gpio/std",
    "ww_stream/std",
]

[dependencies]
all_gpio_api.workspace = true
embassy-futures.workspace = true
wire_weaver.workspace = true
ww_client_server = { workspace = true, features = ["streams"] }
ww_device.workspace = true
ww_gpio.workspace = true
ww_stream = { workspace = true, features = ["streams"] }

[lints]
workspace = true
