[package]
name = "all_gpio"
version = "0.1.0"
description = "Client of the GPIO expander example device, and the device simulated on a PC over WebSocket"
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
all_gpio_api = { workspace = true, features = ["std"] }
all_gpio_device = { workspace = true, features = ["std"] }
futures-util.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
wire_weaver.workspace = true
wire_weaver_client = { workspace = true, features = ["in_process", "usb", "ws"] }
ww_device = { workspace = true, features = ["futures-io"] }
ww_gpio = { workspace = true, features = ["std"] }
ww_si = { workspace = true, features = ["std"] }

[dev-dependencies]
anyhow.workspace = true
book_outputs.workspace = true
clap = { workspace = true, features = ["derive"] }
console.workspace = true
futures = "0.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "test-util"] }
tokio-util.workspace = true
tracing = "0.1"
tracing-subscriber.workspace = true
wire_weaver_cli.workspace = true
ww_gpio_hl.workspace = true
ww_self = { workspace = true }

[[example]]
name = "all_gpio_sim"
path = "examples/sim.rs"

[[example]]
name = "all_gpio_blink"
path = "examples/blink.rs"

[lints]
workspace = true
