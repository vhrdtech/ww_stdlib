[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "stdlib_py"
description = "Python scripts of the standard library examples: wire_weaver_py as the `wire_weaver` module"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["version"]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.maturin]
module-name = "wire_weaver"

[tool.uv]
# Rebuild the module when the lock moves wire_weaver_py
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "../../Cargo.lock" },
]
